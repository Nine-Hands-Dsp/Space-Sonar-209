name: Build Space Sonar 209 VST3 (Windows + macOS)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: 'Mac de GitHub : macos-15 (Apple Silicon) ou macos-15-intel'
        default: 'macos-15'

jobs:
  windows:
    name: VST3 Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SpaceSonar209-VST3-Windows
          path: build/SpaceSonar209_artefacts/Release/VST3/

  macos:
    name: VST3 macOS (universel)
    runs-on: ${{ inputs.mac_runner || 'macos-15' }}   # Mac Apple Silicon par defaut (binaire universel) ; mac-retry.yml relance sur macos-15-intel si aucune machine n'est prise
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G Xcode
      - name: Build (arm64 + x86_64)
        run: cmake --build build --config Release --parallel -- -quiet
      - name: Ad-hoc sign + notice
        run: |
          cd "build/SpaceSonar209_artefacts/Release/VST3"
          codesign --force --deep --sign - "Space Sonar 209.vst3"
          lipo -info "Space Sonar 209.vst3/Contents/MacOS/Space Sonar 209"
          cat > "INSTALL macOS.txt" <<'TXT'
          1. Copy "Space Sonar 209.vst3" to  ~/Library/Audio/Plug-Ins/VST3/   (or /Library/Audio/Plug-Ins/VST3/)
          2. Open Terminal and run once:
                xattr -cr ~/Library/Audio/Plug-Ins/VST3/"Space Sonar 209.vst3"
             (removes the "downloaded from the internet" quarantine flag)
          3. Re-scan plug-ins in Reaper (Options > Preferences > Plug-ins > VST > Re-scan).
          TXT
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SpaceSonar209-VST3-macOS
          path: |
            build/SpaceSonar209_artefacts/Release/VST3/Space Sonar 209.vst3
            build/SpaceSonar209_artefacts/Release/VST3/INSTALL macOS.txt

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les boutons du README (.../releases/latest/download/SpaceSonar209-VST3-<OS>.zip) suivent chaque version.
  # Version Windows publiee sans attendre le Mac (Mac de GitHub parfois satures) ;
  # release-mac ajoute ensuite l'archive macOS a la meme Release.
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'^project\s*\(\s*\w+[^)]*?VERSION\s+([0-9.]+)',open('CMakeLists.txt').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: SpaceSonar209-VST3-Windows
          path: dist/win
      - name: Archives
        run: |
          pack() {
            src="$1"; out="$GITHUB_WORKSPACE/$2"; wrap="$3"
            n=$(ls -A "$src" | wc -l); z=$(ls "$src"/*.zip 2>/dev/null | head -1)
            if [ "$n" = 1 ] && [ -n "$z" ]; then cp "$z" "$out"
            elif [ -n "$wrap" ]; then mkdir -p "pk/$wrap" && cp -a "$src"/. "pk/$wrap/" && (cd pk && zip -r -q -y "$out" "$wrap") && rm -rf pk
            else (cd "$src" && zip -r -q -y "$out" .); fi
          }
          pack dist/win "SpaceSonar209-VST3-Windows.zip" ""
          ls -l *.zip
      - name: Notice
        run: |
          # derniere notice du dossier docs/ (hors guide MIDI), publiee sous un nom fixe
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          if [ -n "$N" ]; then cp "$N" SpaceSonar209-Notice.pdf; echo "notice : $N"; else echo "pas de notice"; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="SpaceSonar209-VST3-Windows.zip"
          [ -f SpaceSonar209-Notice.pdf ] && FILES="$FILES SpaceSonar209-Notice.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest --title "Space Sonar 209 $TAG" --notes "Installation : voir le README (Windows : C:\Program Files\Common Files\VST3 ; macOS : ~/Library/Audio/Plug-Ins/VST3)."
          fi

  release-mac:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [release, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'^project\s*\(\s*\w+[^)]*?VERSION\s+([0-9.]+)',open('CMakeLists.txt').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: SpaceSonar209-VST3-Windows
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: SpaceSonar209-VST3-macOS
          path: dist/mac
      - name: Archives
        run: |
          pack() {
            src="$1"; out="$GITHUB_WORKSPACE/$2"; wrap="$3"
            n=$(ls -A "$src" | wc -l); z=$(ls "$src"/*.zip 2>/dev/null | head -1)
            if [ "$n" = 1 ] && [ -n "$z" ]; then cp "$z" "$out"
            elif [ -n "$wrap" ]; then mkdir -p "pk/$wrap" && cp -a "$src"/. "pk/$wrap/" && (cd pk && zip -r -q -y "$out" "$wrap") && rm -rf pk
            else (cd "$src" && zip -r -q -y "$out" .); fi
          }
          pack dist/win "SpaceSonar209-VST3-Windows.zip" ""
          pack dist/mac "SpaceSonar209-VST3-macOS.zip" ""
          ls -l *.zip
      - name: Notice
        run: |
          # derniere notice du dossier docs/ (hors guide MIDI), publiee sous un nom fixe
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          if [ -n "$N" ]; then cp "$N" SpaceSonar209-Notice.pdf; echo "notice : $N"; else echo "pas de notice"; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="SpaceSonar209-VST3-Windows.zip SpaceSonar209-VST3-macOS.zip"
          [ -f SpaceSonar209-Notice.pdf ] && FILES="$FILES SpaceSonar209-Notice.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest --title "Space Sonar 209 $TAG" --notes "Installation : voir le README (Windows : C:\Program Files\Common Files\VST3 ; macOS : ~/Library/Audio/Plug-Ins/VST3)."
          fi
